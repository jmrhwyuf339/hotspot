  # ------------------------------------------------------------
  # 知乎路由暂不启用：知乎对未登录请求直接返回「安全验证」，本地实测
  #   · rsshub.rssforever.com /zhihu/topic/...、/zhihu/question/... → 503
  #   · rsshub.ktachibana.party 同上 → 503（RSSHub 的知乎路由需配 ZHIHU_COOKIE）
  #   · rss.lilydjwg.me/zhihu/<id>（转知乎动态）→ 503（知乎限频）
  # 等你有一个配好知乎 cookie 的 RSSHub 实例，把下面两条 url 换成该实例地址即可：
  #
  # - name: 知乎话题·社会观察
  #   url: https://<你的RSSHub>/zhihu/topic/<话题id>
  #   type: rss
  #   interest: 社会结构解剖
  #   trusted: true
  #
  # - name: 知乎话题·亲密关系
